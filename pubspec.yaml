name: agent_lints
description: Agent-first custom lint for Dart and Flutter. Define project rules in YAML; get instructional diagnostics from the CLI, dart analyze and your IDE.
version: 0.1.0-dev
repository: https://github.com/pedromassango/agent_lints
topics: [lint, analyzer, flutter, agents]

environment:
  sdk: ^3.11.0

executables:
  agent_lints:

dependencies:
  analysis_server_plugin: ^0.3.19
  analyzer: ^14.0.0
  args: ^2.7.0
  collection: ^1.19.1
  glob: ^2.1.3
  meta: ^1.16.0
  path: ^1.9.1
  source_span: ^1.10.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.0

dev_dependencies:
  analyzer_testing: ^0.4.2
  lints: ^6.0.0
  test: ^1.25.6
  test_descriptor: ^2.0.2
  test_process: ^2.1.1
  test_reflective_loader: ^0.4.0
