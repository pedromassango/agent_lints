# Rules for the example app. Each rule is exercised by lib/ and asserted by
# expected_violations.json in the e2e tests.
version: 2
include: [agent_lints/*.yaml]     # layering rules live in agent_lints/layering.yaml
files: [lib/**]
fail_on: warning
docs: README.md

values:
  spacing:
    - 4
    - { value: 8, name: AppSpacing.sm }
    - { value: 16, name: AppSpacing.md }
    - { value: 24, name: AppSpacing.lg }

rules:
  no_print:
    severity: error
    exclude: [lib/core/log.dart]
    description: Use the app logger instead of print
    call: print
    from: dart:core
    use_instead: AppLog.d(...) from package:agent_lints_example/core/log.dart
    hint: "AppLog.d({{args.0}})"
    message: "`print` ships to release logs. Use {{use_instead}}."
    examples:
      bad: ["void f() { print('x'); }"]
      good: ["import 'package:agent_lints_example/core/log.dart';\nvoid f() { AppLog.d('x'); }"]

  no_gesture_detector_for_taps:
    description: Tap targets need ripple and semantics
    constructor: GestureDetector
    from: flutter
    args: { onTap: present, onPanUpdate: absent }
    use_instead: InkWell (ripple + semantics)
    hint: "InkWell(onTap: {{args.onTap}}, child: ...)"
    message: "GestureDetector with only onTap has no ripple or semantics. Use {{use_instead}}."
    examples:
      bad:
        - |
          import 'package:flutter/material.dart';
          final w = GestureDetector(onTap: () {}, child: const Text('x'));
      good:
        - |
          import 'package:flutter/material.dart';
          final a = InkWell(onTap: () {}, child: const Text('x'));
          final b = GestureDetector(onTap: () {}, onPanUpdate: (_) {}, child: const Text('drag'));

  screens_named_screen:
    files: [lib/features/**]
    class: { extends: StatefulWidget }
    name: { not: "*Screen" }
    message: "{{name}} is a StatefulWidget under lib/features and must end with Screen."

  no_setstate_in_build:
    severity: error
    call: State.setState
    inside: { function: build }
    message: "setState inside build() causes rebuild loops. Move it to a handler or initState."
    examples:
      bad:
        - |
          import 'package:flutter/material.dart';
          class W extends StatefulWidget { const W({super.key}); @override State<W> createState() => _S(); }
          class _S extends State<W> {
            @override
            Widget build(BuildContext context) { setState(() {}); return const Text('x'); }
          }
      good:
        - |
          import 'package:flutter/material.dart';
          class W extends StatefulWidget { const W({super.key}); @override State<W> createState() => _S(); }
          class _S extends State<W> {
            void _tap() => setState(() {});
            @override
            Widget build(BuildContext context) => GestureDetector(onTap: _tap, onPanUpdate: (_) {});
          }

  spacing_on_scale:
    constructor: [EdgeInsets.all, EdgeInsets.symmetric, EdgeInsets.only]
    from: flutter
    args: { "*": { literal: num, not_in: $spacing } }
    message: "{{value}} passed to {{name}}({{arg}}) is off the spacing scale. Allowed: {{allowed}}. Closest: {{closest}}."
    hint: "{{name}}({{arg}}: {{closest.name}})"

  no_palette_colors:
    use: "Colors.*"
    from: flutter
    use_instead: Theme.of(context).colorScheme
    message: "{{name}} is a raw palette color. Use {{use_instead}}."

  listview_in_column:
    constructor: ListView
    args: { shrinkWrap: absent }
    parent: { constructor: Column }
    message: "ListView directly inside {{ancestor}} needs shrinkWrap: true or an Expanded wrapper."
